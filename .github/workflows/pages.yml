name: Deploy Almazov Student Pages

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'data/official-schedules.json'
      - 'data/official-sync-status.json'
      - 'data/program-schedules.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SCHEDULE_ENGINE_VERSION: '4.9.0-rc.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-rus
      - name: Install parser dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-official-sync.txt
      - run: npm install
      - name: Synchronize all official schedules and enforce the production release gate
        run: npm run sync:official
      - name: Release QA and minified production build
        run: npm run qa
        env:
          REQUIRE_MINIFICATION: '1'
          REQUIRE_SPECIALIST_SNAPSHOT: '1'
      - run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
