name: QA
on:
  push:
  pull_request:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser regression dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-official-sync.txt
      - run: npm install
      - name: QA
        run: npm run qa
        env:
          REQUIRE_MINIFICATION: "1"

      - name: Package verified web preview
        run: |
          mkdir -p preview
          tar -czf preview/almazov-web-preview.tar.gz -C dist .
          sha256sum preview/almazov-web-preview.tar.gz > preview/SHA256SUMS
      - id: web-preview
        uses: actions/upload-artifact@v4
        with:
          name: web-preview-${{ github.sha }}
          path: preview/
          retention-days: 14
      - name: Verify artifact readiness against the live Actions service
        timeout-minutes: 3
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.web-preview.outputs.artifact-id }}
          PAGES_ARTIFACT_NAME: web-preview-${{ github.sha }}
        with:
          script: |
            const {pathToFileURL} = require('node:url');
            const {runFromEnvironment} = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/wait-for-pages-artifact.mjs`).href);
            try { await runFromEnvironment({info: core.info}); }
            catch (error) { core.setFailed(error.message); }
