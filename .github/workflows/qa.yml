name: QA
on:
  push:
  pull_request:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser regression dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-official-sync.txt
      - run: npm install
      - name: QA
        run: npm run qa
        env:
          REQUIRE_MINIFICATION: "1"

      - name: Package verified web preview
        run: |
          mkdir -p preview
          tar -czf preview/almazov-web-preview.tar.gz -C dist .
          sha256sum preview/almazov-web-preview.tar.gz > preview/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: web-preview-${{ github.sha }}
          path: preview/
          retention-days: 14
