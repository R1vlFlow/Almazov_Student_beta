name: Build signed Almazov Student release APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-signed-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Load permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: almazov-student-release
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          python3 - <<'PY'
          import base64, os, pathlib, string
          value = ''.join(os.environ['ANDROID_KEYSTORE_BASE64'].lstrip('\ufeff').split())
          try:
              decoded = base64.b64decode(value, validate=True)
          except (ValueError, base64.binascii.Error):
              allowed = set(string.ascii_letters + string.digits + '+/=')
              invalid = [c for c in value if c not in allowed]
              if any(ord(c) > 127 for c in invalid):
                  reason = 'non-ASCII characters present'
              elif invalid:
                  reason = 'characters outside the Base64 alphabet present'
              elif len(value) % 4:
                  reason = 'length is not divisible by four (possibly incomplete copy)'
              else:
                  reason = 'invalid Base64 padding'
              raise SystemExit('Signing secret format error: ' + reason + '. Secret contents are not logged.')
          if not decoded:
              raise SystemExit('Signing keystore is empty.')
          pathlib.Path(os.environ['RUNNER_TEMP'], 'almazov-release.p12').write_bytes(decoded)
          PY
          test -s "$RUNNER_TEMP/almazov-release.p12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install parser dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-official-sync.txt
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Synchronize all official schedules and enforce the production gate
        run: npm run sync:official
      - name: Run full release QA and build the minified web app
        run: npm run qa
        env:
          REQUIRE_MINIFICATION: '1'
          REQUIRE_SPECIALIST_SNAPSHOT: '1'
      - name: Create or sync Capacitor Android project
        run: |
          if [ -d android ]; then
            npx cap sync android
          else
            npx cap add android
            npx cap sync android
          fi
      - name: Set Android release version
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode 33/' android/app/build.gradle
          sed -i -E 's/versionName ".*"/versionName "3.2.0"/' android/app/build.gradle
      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/almazov-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: almazov-student-release
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> android/app/build.gradle <<'EOF'
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storeType "PKCS12"
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
      - name: Assemble signed APK and app bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/almazov-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: almazov-student-release
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease
          cd ..
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/Almazov-Student-3.2.0.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release/Almazov-Student-3.2.0.aab
          sha256sum release/Almazov-Student-3.2.0.apk release/Almazov-Student-3.2.0.aab | tee release/SHA256SUMS.txt
      - name: Verify APK signature and record certificate
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs release/Almazov-Student-3.2.0.apk > release/signature-verification.txt
          cat release/signature-verification.txt
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Almazov-Student-3.2.0-signed-${{ github.run_number }}
          path: |
            release/Almazov-Student-3.2.0.apk
            release/Almazov-Student-3.2.0.aab
            release/SHA256SUMS.txt
            release/signature-verification.txt
          if-no-files-found: error
          retention-days: 30
