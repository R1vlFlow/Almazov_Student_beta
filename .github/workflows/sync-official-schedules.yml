name: Sync official schedules and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-build:
    runs-on: ubuntu-latest
    env:
      SCHEDULE_ENGINE_VERSION: '4.9.0-rc.1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR engine for official scanned schedules
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-rus
      - name: Install parser dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-official-sync.txt
      - name: Install Node dependencies
        run: npm install
      - name: Verify schedule engine metadata
        run: python scripts/verify_engine_version.py
      - name: Synchronize official schedule sources and run the strict production gate
        run: npm run sync:official
      - name: Release QA and minified production build
        run: npm run qa
        env:
          REQUIRE_MINIFICATION: "1"
          REQUIRE_SPECIALIST_SNAPSHOT: "1"
      - name: Preserve synchronization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-schedule-sync-${{ github.run_number }}
          path: |
            reports/live-sync-attempt-latest.json
            reports/production-release-audit.json
            data/official-sync-status.json
            data/kug-source-manifest.json
          if-no-files-found: warn
          retention-days: 7
      - name: Commit validated official data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data reports
          git diff --cached --quiet || git commit -m 'chore: refresh verified official schedules'
          git push
      - run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: sync-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
