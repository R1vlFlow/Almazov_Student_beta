name: Build Almazov Student Android preview APK

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'public/**'
      - 'src/**'
      - 'scripts/**'
      - 'server/**'
      - 'tests/**'
      - 'workflows/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-official-sync.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Run release QA and build the web app
        run: npm run qa
        env:
          REQUIRE_MINIFICATION: '1'
      - name: Create or sync Capacitor Android project
        run: |
          if [ -d android ]; then
            npx cap sync android
          else
            npx cap add android
            npx cap sync android
          fi
      - name: Set forward Android version metadata
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s = re.sub(r'versionCode\s+\d+', 'versionCode 34', s, count=1)
          s = re.sub(r'versionName\s+["\'].*?["\']', 'versionName \"3.2.1\"', s, count=1)
          p.write_text(s)
          PY
      - name: Assemble QA-only APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug
          cd ..
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Almazov-Student-PREVIEW.apk
          sha256sum release/Almazov-Student-PREVIEW.apk | tee release/SHA256SUMS.txt
      - name: Upload QA-only APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Almazov-Student-PREVIEW-not-for-upgrade-${{ github.run_number }}
          path: |
            release/Almazov-Student-PREVIEW.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
