name: Build Almazov Student APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Almazov Student 2.0 APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |

          mkdir -p app/src/main/java/com/almazov/student
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cp index.html app/src/main/assets/index.html

          if [ -f logo.png ]; then
            cp logo.png app/src/main/assets/logo.png
            cp logo.png app/src/main/res/drawable/app_logo.png
          fi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AlmazovStudent"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.almazov.student'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.almazov.student'
                  minSdk 23
                  targetSdk 35
                  versionCode 20
                  versionName '2.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="Almazov Student"
                  android:icon="@drawable/app_logo"
                  android:roundIcon="@drawable/app_logo"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/almazov/student/MainActivity.java <<'EOF'
          package com.almazov.student;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;

              private static final int FILE_CHOOSER_REQUEST = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportMultipleWindows(false);

                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request) {

                          return openExternalUrl(
                                  request.getUrl().toString()
                          );
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              String url) {

                          return openExternalUrl(url);
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams fileChooserParams) {

                          if (MainActivity.this.filePathCallback != null) {
                              MainActivity.this.filePathCallback
                                      .onReceiveValue(null);
                          }

                          MainActivity.this.filePathCallback = callback;

                          Intent intent =
                                  fileChooserParams.createIntent();

                          try {

                              startActivityForResult(
                                      intent,
                                      FILE_CHOOSER_REQUEST
                              );

                          } catch (ActivityNotFoundException e) {

                              MainActivity.this.filePathCallback = null;
                              return false;
                          }

                          return true;
                      }
                  });

                  webView.loadUrl(
                          "file:///android_asset/index.html"
                  );
              }

              private boolean openExternalUrl(String url) {

                  if (url == null || url.isEmpty()) {
                      return false;
                  }

                  if (url.startsWith("file:///android_asset/")) {
                      return false;
                  }

                  if (url.startsWith("http://")
                          || url.startsWith("https://")) {

                      try {

                          Intent intent =
                                  new Intent(
                                          Intent.ACTION_VIEW,
                                          Uri.parse(url)
                                  );

                          startActivity(intent);

                          return true;

                      } catch (Exception e) {

                          return false;
                      }
                  }

                  try {

                      Intent intent =
                              new Intent(
                                      Intent.ACTION_VIEW,
                                      Uri.parse(url)
                              );

                      startActivity(intent);

                      return true;

                  } catch (Exception e) {

                      return false;
                  }
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );

                  if (requestCode != FILE_CHOOSER_REQUEST) {
                      return;
                  }

                  if (filePathCallback == null) {
                      return;
                  }

                  Uri[] results = null;

                  if (resultCode == RESULT_OK && data != null) {

                      if (data.getClipData() != null) {

                          int count =
                                  data.getClipData().getItemCount();

                          results = new Uri[count];

                          for (int i = 0; i < count; i++) {

                              results[i] =
                                      data.getClipData()
                                              .getItemAt(i)
                                              .getUri();
                          }

                      } else if (data.getData() != null) {

                          results = new Uri[]{
                                  data.getData()
                          };
                      }
                  }

                  filePathCallback.onReceiveValue(results);
                  filePathCallback = null;
              }

              @Override
              public void onBackPressed() {

                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          gradle assembleDebug

      - name: Prepare APK
        run: |

          mkdir -p release

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            release/Almazov-Student-2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Almazov-Student-2.0-APK
          path: release/Almazov-Student-2.0.apk
