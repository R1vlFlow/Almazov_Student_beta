name: Build Almazov Student APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Получаем файлы репозитория
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # ==========================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. Android SDK
      # ==========================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'


      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==========================================
      # 4. Проверяем файлы сайта
      # ==========================================

      - name: Check project files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PROJECT FILES"
          echo "======================================"

          ls -la

          echo ""
          echo "Checking index.html..."

          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html not found!"
            exit 1
          fi

          wc -c index.html

          echo ""
          echo "Checking app_icon.png..."

          if [ ! -f "app_icon.png" ]; then
            echo "ERROR: app_icon.png not found!"
            echo ""
            echo "Upload the new application icon"
            echo "to the root of the repository."
            exit 1
          fi

          file app_icon.png

          echo ""
          echo "All required files found."


      # ==========================================
      # 5. Устанавливаем Gradle 8.9
      # ==========================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ==========================================
      # 6. Проверяем Gradle
      # ==========================================

      - name: Check Gradle
        shell: bash
        run: |
          set -e

          echo "Gradle location:"
          command -v gradle

          echo ""
          echo "Gradle version:"
          gradle --version


      # ==========================================
      # 7. Создаём Android-проект
      # ==========================================

      - name: Create Android project
        shell: bash
        run: |

          set -e


          # ----------------------------------------
          # Папки
          # ----------------------------------------

          mkdir -p app/src/main/java/com/almazov/student

          mkdir -p app/src/main/res/drawable

          mkdir -p app/src/main/res/values

          mkdir -p app/src/main/assets


          # ----------------------------------------
          # settings.gradle
          # ----------------------------------------

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AlmazovStudent"

          include(":app")
          EOF


          # ----------------------------------------
          # Главный build.gradle
          # ----------------------------------------

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


          # ----------------------------------------
          # gradle.properties
          # ----------------------------------------

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF


          # ----------------------------------------
          # app/build.gradle
          # ----------------------------------------

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.almazov.student'

              compileSdk 35


              defaultConfig {

                  applicationId 'com.almazov.student'

                  minSdk 23

                  targetSdk 35

                  versionCode 32

                  versionName '3.1.3'
              }


              buildTypes {

                  release {

                      minifyEnabled false

                      shrinkResources false

                      proguardFiles(
                          getDefaultProguardFile(
                              'proguard-android-optimize.txt'
                          ),
                          'proguard-rules.pro'
                      )
                  }
              }
          }
          EOF


          # ----------------------------------------
          # ProGuard
          # ----------------------------------------

          cat > app/proguard-rules.pro <<'EOF'
          # Almazov Student
          # No custom ProGuard rules.
          EOF


          # ----------------------------------------
          # AndroidManifest.xml
          # ----------------------------------------

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">


              <uses-permission
                  android:name="android.permission.INTERNET" />


              <application

                  android:allowBackup="true"

                  android:hardwareAccelerated="true"

                  android:icon="@drawable/app_icon"

                  android:label="Almazov Student"

                  android:roundIcon="@drawable/app_icon"

                  android:supportsRtl="true"

                  android:theme="@style/AppTheme"

                  android:usesCleartextTraffic="true">


                  <activity

                      android:name=".MainActivity"

                      android:configChanges="orientation|screenSize|keyboardHidden"

                      android:exported="true">


                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>


                  </activity>


              </application>


          </manifest>
          EOF


          # ----------------------------------------
          # Тема
          # ----------------------------------------

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:colorAccent">
                      #6C63FF
                  </item>

                  <item name="android:navigationBarColor">
                      #0B1020
                  </item>

                  <item name="android:statusBarColor">
                      #0B1020
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

              </style>

          </resources>
          EOF


          # ----------------------------------------
          # Копируем сайт
          # ----------------------------------------

          cp index.html \
             app/src/main/assets/index.html


          # ----------------------------------------
          # Копируем НОВУЮ ИКОНКУ
          # ----------------------------------------

          cp app_icon.png \
             app/src/main/res/drawable/app_icon.png


          # ----------------------------------------
          # MainActivity.java
          # ----------------------------------------

          cat > app/src/main/java/com/almazov/student/MainActivity.java <<'EOF'
          package com.almazov.student;


          import android.app.Activity;

          import android.content.ActivityNotFoundException;

          import android.content.Intent;

          import android.net.Uri;

          import android.os.Bundle;

          import android.webkit.ValueCallback;

          import android.webkit.WebChromeClient;

          import android.webkit.WebResourceRequest;

          import android.webkit.WebSettings;

          import android.webkit.WebView;

          import android.webkit.WebViewClient;


          public class MainActivity extends Activity {


              private WebView webView;


              private ValueCallback<Uri[]> filePathCallback;


              private static final int
                      FILE_CHOOSER_REQUEST_CODE = 1001;


              @Override

              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);


                  webView = new WebView(this);


                  setContentView(webView);


                  WebSettings settings =
                          webView.getSettings();


                  settings.setJavaScriptEnabled(true);


                  settings.setDomStorageEnabled(true);


                  settings.setAllowFileAccess(true);


                  settings.setAllowContentAccess(true);


                  settings.setDatabaseEnabled(true);


                  settings.setSupportZoom(false);


                  settings.setBuiltInZoomControls(false);


                  settings.setDisplayZoomControls(false);


                  settings.setMediaPlaybackRequiresUserGesture(
                          false
                  );


                  // =================================
                  // WebView
                  // =================================

                  webView.setWebViewClient(
                          new WebViewClient() {


                      @Override

                      public boolean
                      shouldOverrideUrlLoading(

                              WebView view,

                              WebResourceRequest request) {


                          return openExternalLink(

                              request.getUrl()
                                     .toString()

                          );
                      }


                      @Override

                      public boolean
                      shouldOverrideUrlLoading(

                              WebView view,

                              String url) {


                          return openExternalLink(url);
                      }

                  });


                  // =================================
                  // File chooser
                  // =================================

                  webView.setWebChromeClient(

                          new WebChromeClient() {


                      @Override

                      public boolean
                      onShowFileChooser(

                              WebView webView,

                              ValueCallback<Uri[]> callback,

                              FileChooserParams params) {


                          if (filePathCallback != null) {

                              filePathCallback
                                  .onReceiveValue(null);
                          }


                          filePathCallback = callback;


                          try {


                              Intent intent =
                                      params.createIntent();


                              startActivityForResult(

                                  Intent.createChooser(

                                      intent,

                                      "Выберите файл"

                                  ),

                                  FILE_CHOOSER_REQUEST_CODE

                              );


                          } catch (
                                  ActivityNotFoundException e) {


                              filePathCallback = null;


                              return false;
                          }


                          return true;
                      }

                  });


                  // =================================
                  // Запуск приложения
                  // =================================

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );
              }


              // =====================================
              // Внешние ссылки
              // =====================================

              private boolean openExternalLink(
                      String url) {


                  if (url == null) {

                      return false;
                  }


                  if (

                      url.startsWith("http://")

                      ||

                      url.startsWith("https://")

                      ||

                      url.startsWith("tg://")

                      ||

                      url.startsWith("yandexmaps://")

                      ||

                      url.startsWith("geo:")

                      ||

                      url.startsWith("mailto:")

                      ||

                      url.startsWith("tel:")

                  ) {


                      try {


                          Intent intent =

                              new Intent(

                                  Intent.ACTION_VIEW,

                                  Uri.parse(url)

                              );


                          startActivity(intent);


                          return true;


                      } catch (
                              ActivityNotFoundException e) {


                          return false;
                      }
                  }


                  return false;
              }


              // =====================================
              // Результат выбора файла
              // =====================================

              @Override

              protected void onActivityResult(

                      int requestCode,

                      int resultCode,

                      Intent data) {


                  super.onActivityResult(

                      requestCode,

                      resultCode,

                      data

                  );


                  if (

                      requestCode !=

                      FILE_CHOOSER_REQUEST_CODE

                  ) {

                      return;
                  }


                  if (filePathCallback == null) {

                      return;
                  }


                  Uri[] results = null;


                  if (

                      resultCode == RESULT_OK

                      &&

                      data != null

                  ) {


                      if (data.getClipData() != null) {


                          int count =

                              data.getClipData()
                                  .getItemCount();


                          results =
                              new Uri[count];


                          for (

                              int i = 0;

                              i < count;

                              i++

                          ) {


                              results[i] =

                                  data.getClipData()

                                      .getItemAt(i)

                                      .getUri();
                          }


                      } else if (

                          data.getData() != null

                      ) {


                          results = new Uri[] {

                              data.getData()

                          };
                      }
                  }


                  filePathCallback
                      .onReceiveValue(results);


                  filePathCallback = null;
              }


              // =====================================
              // Кнопка "Назад"
              // =====================================

              @Override

              public void onBackPressed() {


                  if (

                      webView != null

                      &&

                      webView.canGoBack()

                  ) {


                      webView.goBack();


                  } else {


                      super.onBackPressed();
                  }
              }


              // =====================================
              // Очистка
              // =====================================

              @Override

              protected void onDestroy() {


                  if (webView != null) {


                      webView.loadUrl(
                          "about:blank"
                      );


                      webView.stopLoading();


                      webView.setWebChromeClient(null);


                      webView.setWebViewClient(null);


                      webView.destroy();
                  }


                  super.onDestroy();
              }

          }
          EOF


      # ==========================================
      # 8. Проверяем Android-проект
      # ==========================================

      - name: Check Android project
        shell: bash
        run: |

          set -e


          echo "======================================"

          echo "ANDROID PROJECT"

          echo "======================================"


          find app \
            -maxdepth 8 \
            -type f \
            | sort


          echo ""


          test -f \
            app/src/main/assets/index.html


          test -f \
            app/src/main/res/drawable/app_icon.png


          test -f \
            app/src/main/AndroidManifest.xml


          test -f \
            app/src/main/java/com/almazov/student/MainActivity.java


          echo ""

          echo "All required Android files found."


      # ==========================================
      # 9. Собираем APK
      # ==========================================

      - name: Build release APK
        shell: bash
        run: |

          set -e


          echo "======================================"

          echo "BUILDING APK"

          echo "======================================"


          gradle \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace


          echo ""

          echo "======================================"

          echo "GENERATED APK FILES"

          echo "======================================"


          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print


      # ==========================================
      # 10. Подписываем APK
      # ==========================================

      - name: Sign APK
        shell: bash
        run: |

          set -e


          echo "======================================"

          echo "SEARCHING FOR APK"

          echo "======================================"


          UNSIGNED_APK=$(

            find app/build/outputs \
              -type f \
              -name "*.apk" \
              | head -n 1

          )


          if [ -z "$UNSIGNED_APK" ]; then

              echo "ERROR: APK was not generated."

              echo ""

              find app/build \
                -maxdepth 10 \
                -type f \
                2>/dev/null || true

              exit 1

          fi


          echo "APK found:"

          echo "$UNSIGNED_APK"


          mkdir -p release


          # ----------------------------------------
          # Создаём ключ подписи
          # ----------------------------------------

          KEYSTORE="$RUNNER_TEMP/almazov-student.jks"


          echo ""

          echo "Creating signing key..."


          keytool \
            -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass "almazov123" \
            -keypass "almazov123" \
            -alias "almazov-student" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Almazov Student, OU=Almazov Student, O=Almazov Student, L=Saint Petersburg, ST=SPb, C=RU"


          # ----------------------------------------
          # Пути к Android Build Tools
          # ----------------------------------------

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"


          echo ""

          echo "Checking Android build tools..."


          if [ ! -f "$ZIPALIGN" ]; then

              echo "ERROR: zipalign not found."

              exit 1

          fi


          if [ ! -f "$APKSIGNER" ]; then

              echo "ERROR: apksigner not found."

              exit 1

          fi


          # ----------------------------------------
          # Zipalign
          # ----------------------------------------

          echo ""

          echo "Running zipalign..."


          "$ZIPALIGN" \
            -f \
            4 \
            "$UNSIGNED_APK" \
            release/aligned.apk


          # ----------------------------------------
          # Подпись APK
          # ----------------------------------------

          echo ""

          echo "Signing APK..."


          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:almazov123 \
            --key-pass pass:almazov123 \
            --ks-key-alias almazov-student \
            --out release/Almazov-Student-3.1.3.apk \
            release/aligned.apk


          # ----------------------------------------
          # Проверка подписи
          # ----------------------------------------

          echo ""

          echo "Verifying APK..."


          "$APKSIGNER" verify \
            --verbose \
            release/Almazov-Student-3.1.3.apk


          # ----------------------------------------
          # Удаляем временный файл
          # ----------------------------------------

          rm -f release/aligned.apk


          echo ""

          echo "======================================"

          echo "FINAL APK"

          echo "======================================"


          ls -lh \
            release/Almazov-Student-3.1.3.apk


      # ==========================================
      # 11. Загружаем APK в Artifacts
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: Almazov-Student-3.1.3-APK

          path: |
            release/Almazov-Student-3.1.3.apk

          if-no-files-found: error
