<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071632">
<title>Нет интернета — Almazov Student</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f9fc;color:#13233f}body{display:grid;place-items:center;padding:18px;overflow:hidden}.wrap{width:min(760px,100%);text-align:center}.brand{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:14px;font-weight:800;color:#17345f}.brand img{width:40px;height:40px;border-radius:12px}.card{position:relative;overflow:hidden;padding:24px 22px 20px;border:1px solid #dce5f2;border-radius:28px;background:linear-gradient(145deg,#fff,#f2f6fc);box-shadow:0 20px 60px rgba(24,54,93,.12)}.status{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;background:#fff7e8;border:1px solid #f3dfb6;color:#9b6715;font-size:12px;font-weight:800}.dot{width:7px;height:7px;border-radius:50%;background:#d89b32}h1{font-size:28px;line-height:1.15;margin:14px 0 8px;color:#17345f}p{color:#667995;line-height:1.5;margin:0 auto 14px;max-width:560px}.game{position:relative;height:245px;margin:18px 0 10px;border-radius:22px;background:linear-gradient(#eaf4ff,#fff);overflow:hidden;border:1px solid #dce7f4;touch-action:manipulation;cursor:pointer}.score{position:absolute;right:14px;top:11px;font:800 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#71839e}.high{position:absolute;left:14px;top:11px;font-size:11px;color:#8a9ab1}.cloud{position:absolute;width:76px;height:18px;border-radius:20px;background:#d7e7f8;opacity:.65;left:14%;top:45px}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:#d7e7f8}.cloud:before{width:30px;height:30px;left:12px;top:-14px}.cloud:after{width:42px;height:42px;left:34px;top:-24px}.cloud.two{left:68%;top:82px;transform:scale(.72);opacity:.45}.sun{position:absolute;width:54px;height:54px;border-radius:50%;right:10%;top:25px;background:#f2c66d;opacity:.75}.ground{position:absolute;left:0;right:0;bottom:38px;height:2px;background:#b8c9dd}.ground:after{content:"";position:absolute;inset:7px 0 auto 0;height:1px;background:repeating-linear-gradient(90deg,#b8c9dd 0 14px,transparent 14px 29px);opacity:.65}.player{position:absolute;left:54px;bottom:42px;width:48px;height:50px;transition:transform .08s;filter:drop-shadow(0 6px 4px rgba(38,63,92,.15))}.player .body{position:absolute;left:5px;bottom:0;width:38px;height:35px;border:3px solid #17345f;border-radius:18px 18px 12px 12px;background:#c98b4a}.player .head{position:absolute;left:9px;top:0;width:30px;height:29px;border:3px solid #17345f;border-radius:50%;background:#d79a59}.player .eye{position:absolute;right:8px;top:8px;width:4px;height:4px;border-radius:50%;background:#17345f}.player .tail{position:absolute;left:-7px;bottom:3px;width:18px;height:12px;border:3px solid #17345f;border-radius:50%;background:#b8783f;transform:rotate(-18deg)}.player .foot{position:absolute;bottom:-4px;width:12px;height:7px;border:3px solid #17345f;border-radius:7px;background:#b8783f}.player .foot.a{left:6px}.player .foot.b{right:5px}.player.jump{animation:jump .58s cubic-bezier(.2,.8,.3,1)}@keyframes jump{0%{bottom:42px}45%{bottom:132px}100%{bottom:42px}}.obstacle{position:absolute;bottom:39px;right:-42px;width:25px;height:38px;border:3px solid #17345f;border-radius:9px 9px 4px 4px;background:#91b77b;box-shadow:8px 5px 0 -3px #91b77b}.obstacle:before,.obstacle:after{content:"";position:absolute;background:#91b77b;border:3px solid #17345f;border-bottom:0;width:11px;height:15px;bottom:17px;border-radius:7px 7px 0 0}.obstacle:before{left:-8px}.obstacle:after{right:-8px}.obstacle.run{animation:none}.message{position:absolute;inset:0;display:none;place-items:center;background:rgba(247,249,252,.86);backdrop-filter:blur(3px);font-weight:800;color:#17345f}.message.show{display:grid}.message span{display:block;font-size:13px;color:#71839e;font-weight:600;margin-top:5px}.hint{font-size:11px;color:#8797ad}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.btn{border:1px solid #d8e2ef;border-radius:12px;padding:10px 15px;background:#fff;color:#17345f;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(100deg,#318cf5,#7555e8);border:0;color:#fff}.btn:active{transform:translateY(1px)}@media(max-width:520px){h1{font-size:24px}.card{padding:21px 13px 17px}.game{height:220px}.player{left:34px}.wrap{max-width:100%}}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand"><img src="logo.png" alt=""><span>Almazov Student</span></div>
  <section class="card">
    <div class="status"><span class="dot"></span> Нет подключения к интернету</div>
    <h1>Интернет решил взять выходной 🐾</h1>
    <p>Ничего страшного — локальные данные остаются на устройстве. А пока соединение возвращается, можно немного побегать.</p>
    <div class="game" id="game" aria-label="Мини-игра Almazov Student">
      <div class="sun"></div><div class="cloud"></div><div class="cloud two"></div><div class="ground"></div>
      <div class="high" id="high">Рекорд: 0</div><div class="score" id="score">0</div>
      <div class="player" id="player"><i class="tail"></i><i class="body"></i><i class="head"></i><i class="eye"></i><i class="foot a"></i><i class="foot b"></i></div>
      <div class="obstacle" id="obstacle"></div>
      <div class="message" id="message"><div>Столкновение!<span>Нажми, чтобы начать заново</span></div></div>
    </div>
    <div class="hint">Тапни по полю или нажми Space / ↑, чтобы прыгнуть</div>
    <div class="actions" style="margin-top:15px">
      <button class="btn primary" id="check">↻ Проверить соединение</button>
      <button class="btn" id="back">← Назад</button>
    </div>
  </section>
</main>
<script>
const game=document.getElementById('game'),player=document.getElementById('player'),obstacle=document.getElementById('obstacle'),scoreEl=document.getElementById('score'),highEl=document.getElementById('high'),message=document.getElementById('message'),check=document.getElementById('check');
let score=0,high=Number(localStorage.getItem('almazov_offline_high')||0),jumping=false,dead=false,running=true,last=0,spawn=0,speed=290,obsX=0;
highEl.textContent='Рекорд: '+high;
function reset(){score=0;speed=290;spawn=0;dead=false;running=true;obsX=game.clientWidth+30;obstacle.style.right='auto';obstacle.style.left=obsX+'px';message.classList.remove('show');scoreEl.textContent='0'}
function jump(){if(dead){reset();return}if(jumping)return;jumping=true;player.classList.add('jump');setTimeout(()=>{player.classList.remove('jump');jumping=false},580)}
function hit(){dead=true;running=false;if(score>high){high=score;localStorage.setItem('almazov_offline_high',high);highEl.textContent='Рекорд: '+high}message.classList.add('show')}
function loop(t){if(!last)last=t;const dt=Math.min(.035,(t-last)/1000);last=t;if(running){obsX-=speed*dt;spawn+=dt;if(obsX<-55){obsX=game.clientWidth+40;score++;scoreEl.textContent=score;speed=Math.min(520,290+score*7);spawn=0}obstacle.style.left=obsX+'px';const p=player.getBoundingClientRect(),o=obstacle.getBoundingClientRect();if(p.right-8>o.left+5&&p.left+8<o.right-5&&p.bottom-7>o.top+4&&p.top+8<o.bottom-3)hit()}requestAnimationFrame(loop)}requestAnimationFrame(loop);
game.addEventListener('pointerdown',e=>{e.preventDefault();jump()});window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});message.addEventListener('click',e=>{e.stopPropagation();reset()});check.addEventListener('click',()=>location.reload());document.getElementById('back').addEventListener('click',()=>history.back());window.addEventListener('online',()=>location.reload());reset();
</script>
</body></html>
